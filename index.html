
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown For Apsara ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #2b082e 0%, #0d0112 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 12px;
            position: relative;
        }

        /* Floating Stars & Hearts */
        .sparkle {
            position: absolute;
            background: #ff5e97;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            animation: pulseSparkle 3s infinite ease-in-out alternate;
        }
        @keyframes pulseSparkle {
            0% { transform: scale(0.6); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Main Glass Stage */
        .stage {
            width: 100%;
            max-width: 385px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 94, 151, 0.35);
            border-radius: 28px;
            padding: 24px 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 42, 109, 0.25);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ff5e97;
            text-shadow: 0 0 15px rgba(255, 94, 151, 0.6);
            margin-bottom: 6px;
        }

        .date-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff2a6d, #ff5e97);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(255, 42, 109, 0.4);
        }

        /* Photo Frame Tile */
        .photo-viewer {
            width: 205px;
            height: 240px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 28px rgba(0,0,0,0.6), 0 0 25px rgba(255, 94, 151, 0.4);
            transition: all 0.35s ease;
        }

        .subtitle {
            font-size: 1rem;
            color: #ffd8e8;
            line-height: 1.55;
            margin-bottom: 14px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #ff2a6d, #ff5e97);
            color: #fff;
            border: none;
            padding: 13px 20px;
            border-radius: 35px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(255, 42, 109, 0.45);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }

        .hidden { display: none !important; }

        /* Countdown selector bar for testing all dates */
        .dates-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 0;
            margin-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        .d-chip {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 94, 151, 0.4);
            color: #ffcce0;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .d-chip.active {
            background: #ff2a6d;
            color: #fff;
            font-weight: bold;
            border-color: #fff;
        }

        /* Verified Name Input */
        .input-glass {
            width: 100%;
            padding: 12px 16px;
            border-radius: 15px;
            border: 1.5px solid #ff4d88;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-top: 10px;
        }
        .input-glass::placeholder { color: rgba(255, 255, 255, 0.5); }
        .err-msg { color: #ff5e97; font-size: 0.85rem; margin-top: 6px; min-height: 18px; }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="bgMusic" loop preload="auto">
        <source src="Neethanadi-MassTamilan.fm.mp3" type="audio/mpeg">
    </audio>

    <div class="stage">
        
        <div id="dateTag" class="date-badge">NOVEMBER 01</div>
        <div id="mainPhoto" class="photo-viewer"></div>

        <!-- Verification Gate (First time only) -->
        <div id="lockGate">
            <h1 class="title">Unlock Daily Surprise 🙈</h1>
            <p style="color: #ffd8e8; font-size: 0.88rem;">Enter your cute name to unlock:</p>
            <input type="text" id="nameInput" class="input-glass" placeholder="Your name...">
            <div id="errMsg" class="err-msg"></div>
            <button class="btn" onclick="unlockDailyCard()">Unlock Surprise 🔓</button>
        </div>

        <!-- Daily Wishes Showcase -->
        <div id="wishContent" class="hidden">
            <h1 id="wishTitle" class="title">Advance Birthday Wish ❤️</h1>
            <div id="wishText" class="subtitle"></div>
            <div id="wishEmojis" style="font-size: 32px; margin-bottom: 8px;">🎂 🎁 💖</div>
            <button class="btn" onclick="playMusicTrack()">Play Music 🎶</button>

            <!-- Test / View other dates -->
            <p style="font-size: 0.72rem; color: #ffb3cc; margin-top: 15px;">Tap any day to preview countdown:</p>
            <div class="dates-scroll" id="chipsBar"></div>
        </div>

    </div>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // Floating Stars
        for (let i = 0; i < 30; i++) {
            let s = document.createElement('div');
            s.className = 'sparkle';
            let size = Math.random() * 4 + 2;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(s);
        }

        // Daily Customized Wishes from Nov 1 to Nov 12
        const dailySurprises = {
            1: {
                date: "NOVEMBER 01",
                title: "Advance Birthday Wish ❤️",
                wish: "Advance Happy Birthday 🎂 thangoooo! En iniyavale smile pannite irukanum eppovume ✨",
                photo: "IMG_20260912_190248_988.jpg",
                emojis: "🎂 💝 🌸"
            },
            2: {
                date: "NOVEMBER 02",
                title: "Day 02 Surprise 🕊️",
                wish: "Advance Happy Birthday mailuu! Unoda cute smile dhaan enakku eppovume special 💖",
                photo: "IMG_20260912_190256_003.jpg",
                emojis: "🕊️ ✨ 🌹"
            },
            3: {
                date: "NOVEMBER 03",
                title: "Day 03 Surprise 🧸",
                wish: "Advance Happy Birthday kutta! Always be bold, edhukagavum alaugha koodadhu strong girl 💪",
                photo: "IMG_20260912_190305_617.jpg",
                emojis: "🧸 🎈 💕"
            },
            4: {
                date: "NOVEMBER 04",
                title: "Day 04 Surprise 🐥",
                wish: "Advance Happy Birthday kutta mailu! En cute vaalu neethaan eppodhum 🤭",
                photo: "IMG_20260912_190314_737.jpg",
                emojis: "🐥 🎂 💐"
            },
            5: {
                date: "NOVEMBER 05",
                title: "Day 05 Surprise 🥰",
                wish: "Advance Happy Birthday chlmm! Unkooda pesumbodhu time poradhey theriyala ✨",
                photo: "IMG_20260912_190256_003.jpg",
                emojis: "🥰 💖 🎁"
            },
            6: {
                date: "NOVEMBER 06",
                title: "Day 06 Surprise 💎",
                wish: "Advance Happy Birthday en vairam! En life-la kedaicha precious gift neethaan 💎❤️",
                photo: "IMG_20260912_190248_988.jpg",
                emojis: "💎 🌹 ✨"
            },
            7: {
                date: "NOVEMBER 07",
                title: "Day 07 Surprise ✏️️",
                wish: "Advance Happy Birthday pencil! Konjam thadi aana cute-a iruppa la 😜",
                photo: "IMG_20260912_190305_617.jpg",
                emojis: "✏️ 🤭 🌸"
            },
            8: {
                date: "NOVEMBER 08",
                title: "Day 08 Surprise 🌸",
                wish: "Advance Happy Birthday apsuu! You are genuinely special and very close to my heart 💝",
                photo: "IMG_20260912_190314_737.jpg",
                emojis: "🌸 🎂 👑"
            },
            9: {
                date: "NOVEMBER 09",
                title: "Day 09 Surprise 🙈",
                wish: "Advance Happy Birthday apseyy! The countdown is getting closer thangom ⏳✨",
                photo: "IMG_20260912_190256_003.jpg",
                emojis: "🙈 💖 🎉"
            },
            10: {
                date: "NOVEMBER 10",
                title: "Day 10 Surprise 🌍",
                wish: "Advance Happy Birthday to my world! Innum two days dhaan irukku periya surprise-ku 🎁",
                photo: "IMG_20260912_190248_988.jpg",
                emojis: "🌍 🌹 🛍️"
            },
            11: {
                date: "NOVEMBER 11",
                title: "Day 11 Surprise 👑",
                wish: "Advance Happy Birthday di pondatti! Tomorrow is your big day princess ✨🥰",
                photo: "IMG_20260912_190305_617.jpg",
                emojis: "👑 🎊 🥳"
            },
            12: {
                date: "NOVEMBER 12",
                title: "🎉 THE GRAND FINALE 🎉",
                wish: "One more time happy birthday di kutta mailuu! Many more happy returns thangoooooooooooo 🥳🎉💃💖",
                photo: "IMG_20260912_190314_737.jpg",
                emojis: "🥳 🎉 💃 💖"
            }
        };

        const photoBox = document.getElementById('mainPhoto');

        function setDayView(dayNum) {
            const data = dailySurprises[dayNum];
            if (!data) return;

            document.getElementById('dateTag').innerText = data.date;
            document.getElementById('wishTitle').innerText = data.title;
            document.getElementById('wishEmojis').innerText = data.emojis;

            // Smooth Photo Transition
            photoBox.style.opacity = '0';
            photoBox.style.transform = 'scale(0.92)';
            setTimeout(() => {
                photoBox.style.backgroundImage = `url('${data.photo}')`;
                photoBox.style.opacity = '1';
                photoBox.style.transform = 'scale(1)';
            }, 200);

            // Typewriter wish
            let elem = document.getElementById('wishText');
            elem.innerHTML = '';
            let i = 0;
            function type() {
                if (i < data.wish.length) {
                    elem.innerHTML += data.wish.charAt(i);
                    i++;
                    setTimeout(type, 35);
                }
            }
            type();

            // Fireworks for Day 12
            if (dayNum === 12) blastConfetti();
        }

        // Auto date detector (default to Nov 1 if before Nov)
        function getInitialDay() {
            const now = new Date();
            if (now.getMonth() === 10) { // 10 = November
                let d = now.getDate();
                if (d >= 1 && d <= 12) return d;
                if (d > 12) return 12;
            }
            return 1;
        }

        function unlockDailyCard() {
            let input = document.getElementById('nameInput').value.trim().toLowerCase();
            let err = document.getElementById('errMsg');
            
            if (input === 'apsar banu' || input === 'apsara') {
                err.innerText = '';
                document.getElementById('lockGate').classList.add('hidden');
                document.getElementById('wishContent').classList.remove('hidden');
                
                playMusicTrack();
                blastConfetti();
                
                let curDay = getInitialDay();
                renderChips(curDay);
                setDayView(curDay);
            } else if (input === '') {
                err.innerText = 'Name-a enter pannu thangom! 🙈';
            } else {
                err.innerText = 'Hey, correct name type pannu! ❤️';
            }
        }

        function playMusicTrack() {
            let music = document.getElementById('bgMusic');
            try { music.currentTime = 25; } catch(e) {}
            music.play().catch(e => { music.play(); });
        }

        function renderChips(activeDay) {
            const chipsBar = document.getElementById('chipsBar');
            chipsBar.innerHTML = '';
            for (let d = 1; d <= 12; d++) {
                let btn = document.createElement('button');
                btn.className = 'd-chip' + (d === activeDay ? ' active' : '');
                btn.innerText = 'Nov ' + (d < 10 ? '0' + d : d);
                btn.onclick = () => {
                    document.querySelectorAll('.d-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    setDayView(d);
                };
                chipsBar.appendChild(btn);
            }
        }

        // Photo default preview
        photoBox.style.backgroundImage = "url('IMG_20260912_190248_988.jpg')";

        // Confetti Fireworks
        function blastConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();
        }
    </script>
</body>
</html>
