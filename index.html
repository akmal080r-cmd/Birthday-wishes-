
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            color: #4a1c22;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url('bg.jpg') no-repeat center center/cover;
            background-color: #ffccd5;
        }
        .emoji-bg { position: absolute; font-size: 25px; animation: floatUp 7s linear infinite; z-index: 1; opacity: 0.7; bottom: -50px; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 20% { opacity: 0.7; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
        
        .card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            text-align: center; 
            width: 85%; 
            max-width: 360px; 
            position: relative; 
            z-index: 10; 
            border: 1.5px solid rgba(255, 255, 255, 0.7); 
            min-height: 250px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        h1 { color: #ff2a55; font-size: 1.6rem; margin-bottom: 12px; }
        .text-box { font-size: 1.15rem; line-height: 1.6; color: #222; min-height: 70px; }
        .btn { 
            background: linear-gradient(135deg, #ff4d6d, #ff2a55); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 15px; 
            font-size: 1rem; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 15px; 
            box-shadow: 0 4px 15px rgba(255, 42, 85, 0.4);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .hidden { display: none !import
