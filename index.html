<!-- NOV 12 ONLY AUDIO ENGINE + HIDE SONG ON OTHER DAYS + DATE LOCK -->
<style>
    /* Song status pill badge hidden on normal days */
    .music-pill, #musicBtn, #musicActionBtn {
        display: none !important;
    }
    /* Shows only on Nov 12 */
    .show-on-finale {
        display: inline-flex !important;
    }
    .d-chip.is-locked, .r-chip.is-locked {
        opacity: 0.35 !important;
        border-color: #555 !important;
        background: rgba(0, 0, 0, 0.5) !important;
        cursor: not-allowed !important;
    }
    #lockToastMsg {
        color: #ffb3cc;
        font-size: 0.85rem;
        font-weight: 600;
        margin: 8px auto;
        min-height: 22px;
        text-align: center;
        display: block;
    }
</style>

<script>
(function() {
    function getTodayLockLimit() {
        const today = new Date();
        const month = today.getMonth(); // 10 = November
        const date = today.getDate();

        if (month < 10) return 1;
        if (month > 10) return 12;
        return Math.min(Math.max(date, 1), 12);
    }

    const myAudio = document.getElementById('bgMusic') || document.querySelector('audio');

    // Control audio strictly based on day
    function handleMusicVisibility(activeDay) {
        const pill = document.querySelector('.music-pill') || document.getElementById('musicBtn') || document.getElementById('musicActionBtn');
        
        if (activeDay === 12) {
            // Nov 12 Grand Finale: Show pill and play song
            if (pill) {
                pill.classList.add('show-on-finale');
                pill.innerHTML = '<span>🎶 Neethanadi Playing...</span>';
            }
            if (myAudio) {
                try {
                    myAudio.currentTime = 25;
                    myAudio.play().catch(() => {});
                } catch(e) {}
            }
        } else {
            // Days 1 to 11: Mute/Pause audio and hide badge completely
            if (pill) {
                pill.classList.remove('show-on-finale');
                pill.style.display = 'none';
            }
            if (myAudio) {
                try {
                    myAudio.pause();
                    myAudio.currentTime = 0;
                } catch(e) {}
            }
        }
    }

    // Stop auto-play immediately when gift box unwrap happens
    const origUnwrap = window.unwrapSurprise;
    if (typeof origUnwrap === 'function') {
        window.unwrapSurprise = function() {
            origUnwrap();
            const currentActiveDay = getTodayLockLimit();
            handleMusicVisibility(currentActiveDay);
        };
    }

    function createToast() {
        let t = document.getElementById('lockToastMsg');
        if (!t) {
            t = document.createElement('div');
            t.id = 'lockToastMsg';
            const bar = document.getElementById('chipsBar') || document.querySelector('.dates-scroll') || document.getElementById('rChips');
            if (bar && bar.parentNode) {
                bar.parentNode.insertBefore(t, bar);
            }
        }
        return t;
    }

    function freezeLockedDays() {
        const limit = getTodayLockLimit();
        const chips = document.querySelectorAll('.d-chip, .r-chip');
        const toast = createToast();

        chips.forEach((btn, index) => {
            const dayNum = index + 1;

            if (dayNum > limit) {
                btn.classList.add('is-locked');
                btn.classList.remove('active');
                if (!btn.innerText.includes('🔒')) {
                    btn.innerText = '🔒 ' + btn.innerText.replace('🔒', '').trim();
                }

                btn.onclick = function(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                    }
                    if (toast) {
                        toast.innerText = "Innikku idhu open aagadhu di kutta, wait pannu! 🤭🔒";
                        setTimeout(() => { toast.innerText = ""; }, 2500);
                    }
                    return false;
                };
            } else {
                // For unlocked allowed days: trigger music check on tab switch
                const oldClick = btn.onclick;
                btn.onclick = function(e) {
                    if (typeof oldClick === 'function') oldClick.call(this, e);
                    handleMusicVisibility(dayNum);
                };
            }
        });
    }

    // Initial check
    setInterval(freezeLockedDays, 250);
    handleMusicVisibility(getTodayLockLimit());
})();
</script>
